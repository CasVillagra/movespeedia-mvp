# DigitalOcean App Platform spec for the MoveSpeedia MVP.
#
# Create:  doctl apps create --spec .do/app.yaml
# Update:  doctl apps update <APP_ID> --spec .do/app.yaml
#
# Requires the DigitalOcean GitHub integration to be authorized for the
# MoveSpeedia-Inc organization, otherwise the source below cannot be read.

name: movespeedia-mvp
region: sfo   # San Francisco — closest to the Los Angeles market and to the
              # Supabase project in us-west-1.

services:
  - name: web
    # Next.js needs a Node server here, not a static site: the app uses a
    # proxy (middleware) for locale routing and Supabase session refresh,
    # and renders pages per request.
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb

    github:
      repo: MoveSpeedia-Inc/movespeedia-mvp
      branch: main
      deploy_on_push: true

    build_command: pnpm install --frozen-lockfile && pnpm build
    run_command: pnpm start

    # App Platform injects PORT with this value; `next start` reads it.
    http_port: 8080

    health_check:
      http_path: /en
      initial_delay_seconds: 20
      period_seconds: 15
      failure_threshold: 5

    envs:
      # Needed at build time as well: the home page is server-rendered and
      # reads the catalog during the build's page-data collection.
      - key: NEXT_PUBLIC_SUPABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: https://lojqzqkpahcmcuxpgcby.supabase.co

      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        scope: RUN_AND_BUILD_TIME
        value: sb_publishable_aaMxdy1jr3uHOpPa4gO8sA_fV2zql6n

      # Bypasses row level security. Set this in the App Platform UI as an
      # encrypted variable, or via `doctl`, and never commit the real value.
      # Not required until server-side quote calculation lands in milestone 2.
      - key: SUPABASE_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_APP_PLATFORM

      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
